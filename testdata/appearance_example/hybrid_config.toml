node_id = 3
tcp_listen_address = "127.0.0.1:8003"
unix_socket = "/tmp/event_listener.sock"
log_file = "appearance_hybrid.log"

[[constraints]]
constraint_role = "AppearanceCounter"
constraint_id = "appearance_test"
event_id = "appearance_counter_event"
mode = "Min"
frequency = 2
reset = "Subtract"

[[constraints]]
constraint_role = "AppearanceTrigger"
constraint_id = "appearance_test"
event_id = "appearance_trigger_event"
counter_peers = ["127.0.0.1:8003"]

[overlay]
listen_address = "127.0.0.1:9003"
initial_peers = []
shuffle_interval = "1h"