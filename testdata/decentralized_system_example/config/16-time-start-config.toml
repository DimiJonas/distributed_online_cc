mode = "distributed"
node_id = 16
tcp_listen_address = "127.0.0.1:19016"
unix_socket = "/tmp/event_listener_tstart.sock"
log_file = "time-start.log"
result_sink_addresses = ["127.0.0.1:19011"]

[[constraints]]
constraint_role = "TimeStart"
constraint_id = "time_test"
event_id = "time_start_event"
duration = "10s"
mode = "Min"

[default_result_buffer]
policy = "Revocable"
duration = "10s"

[overlay]
listen_address = "127.0.0.1:9016"
initial_peers = ["127.0.0.1:9001", "127.0.0.1:9005", "127.0.0.1:9013", "127.0.0.1:9014", "127.0.0.1:9015", "127.0.0.1:9017", "127.0.0.1:9018"]
shuffle_interval = "30s"
shuffle_length = 4
max_peer_cache_size = 20
idle_timeout = "30m"