mode = "distributed"
node_id = 11
tcp_listen_address = "127.0.0.1:19011"
unix_socket = "/tmp/event_listener_rs.sock"
log_file = "result_sink.log"
constraints = []

[result_sink]
db_path = "run/results.db"
mpsc_channel_size = 1024
retry_interval = "15s"
retry_buffer_size = 4096

[overlay]
listen_address = "127.0.0.1:9011"
initial_peers = ["127.0.0.1:9000", "127.0.0.1:9008", "127.0.0.1:9009", "127.0.0.1:9010", "127.0.0.1:9012", "127.0.0.1:9013", "127.0.0.1:9015"]
shuffle_interval = "30s"
shuffle_length = 4
max_peer_cache_size = 20
idle_timeout = "30m"