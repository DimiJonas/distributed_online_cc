# E2: idle cost
# should be excluded from any correctness aggregation in plot_results.py because idle only produces no results (all results missing in db)
# metrics: cpu/node, rss/node, msg/s and bytes/s by payload class (overlay vs ce_gossip), idle_bytes_per_node_second
[[experiment]]
id = "E2"
seeds = [1]
replicates = 3
systems = ["decentralized", "central"]
  [experiment.params]
  cases = 1
  idle_window_s = 120
  idle_only = true
  msgtrace = true
  [experiment.grid]
  nodes = [3, 5, 7, 12, 23, 32, 46]

# E3a: system scale round robin
# metrics: messages/case, messages/event, cpu total, cpu max (busiest node), idle-normalized overhead, detection latency
[[experiment]]
id = "E3a"
seeds = [2, 3, 5]
replicates = 3
systems = ["decentralized", "central"]
  [experiment.params]
  cases = 10000
  rate = 4000
  role_assignment = "round-robin"
  [experiment.grid]
  nodes = [3, 5, 7, 12, 23, 46, 92]

# E3b: system scale blocked
# metrics: (same as E3a)
[[experiment]]
id = "E3b"
seeds = [2, 3, 5]
replicates = 3
systems = ["decentralized", "central"]
  [experiment.params]
  cases = 10000
  rate = 4000
  role_assignment = "blocked"
  [experiment.grid]
  nodes = [3, 5, 7, 12]

# E5a: main privacy run sepsis
# metrics: all privacy metrics, bytes/event by payload class
[[experiment]]
id = "E5a"
seeds = [1]
replicates = 8                          # many replicates to rule out cyclon/gossip randomness for first spy
systems = ["decentralized", "central"]
  [experiment.params]
  catalog = "sepsis"
  role_assignment = "by-event"
  stream_dir = "sepsis/events/"
  msgtrace = true
  burst = 8
  [experiment.grid]
  nodes = [2, 4, 8, 13, 17, 18]         # sepsis has 17 activities -> 17 nodes constraint nodes + 1 sink = 18 (with by-event assignment) 
  rate = [500, 1000]

# E5b: main privacy run traffic fines
# ~561k events so depending on E0c extract_metrics.py --observation-case-fraction 0.2 might be needed, but this sampling of cases can increase trace uniqueness
# metrics: all privacy metrics, bytes/event by payload class
[[experiment]]
id = "E5b"
seeds = [1]
replicates = 6                          # many replicates to rule out cyclon/gossip randomness for first spy (less than for sepsis because the event log is much bigger)
systems = ["decentralized", "central"]
  [experiment.params]
  catalog = "traffic-fines"
  role_assignment = "by-event"
  stream_dir = "traffic_fines/events/" 
  msgtrace = true
  burst = 8
  rate = 4000
  [experiment.grid]
  nodes = [2, 4, 6, 8, 10, 13]           # traffic fines has 12 activities -> 12 nodes constraint nodes + 1 sink = 13 (with by-event assignment) 

# E6a: gossip sensitivity
# towards R2: message overhead and case end verdict latency
# towards R1: first-spy source anonymity since hop count varies with fanout
[[experiment]]
id = "E6a"
seeds = [2]
replicates = 5
systems = ["decentralized"]
  [experiment.params]
  cases = 10000
  rate = 4000
  msgtrace = true
  [experiment.sensitivity]
  push_fanout = [1, 2, 4, 8, 16]
  anti_entropy_secs = [1, 2, 4, 8]
  anti_entropy_fanout = [1, 2, 4]
  case_end_ttl = [20, 60, 120]

# E6b: overlay sensitivity
# metrics: idle_bytes_per_node_second, peer_churn, first-spy precision/recall, gossip_dissemination reach_fraction
[[experiment]]
id = "E6b"
seeds = [2]
replicates = 5
systems = ["decentralized"]
  [experiment.params]
  cases = 2500
  rate = 1000
  msgtrace = true
  [experiment.sensitivity]
