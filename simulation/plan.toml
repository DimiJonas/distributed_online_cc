# stream plan for thesis experiments

#  there are 3 stream tiers such that the load window stays in the 15-65 s range instead of varying too much (up  to 100x with rate 500 vs 50.000):
#  - S  cases =  2500  (~65k events)   rates <= 2000
#  - M  cases = 10000  (~260k events)  rates 4000 .. 16000
#  - L  cases = 30000  (~780k events)  rates >= 24000
#  an experiment that needs more than one tier can then be written as multiple [[experiment]] blocks with the same id

[defaults]
repo_root = "."
results_dir = "results"
bin_dir = "target/release"
node_bin = "target/release/node"
python = "python3.11"
send_script = "send_event_stream.py"
compare_script = "compare_results.py"
rust_log = "warn"
rust_log_file = "warn"
resource_interval_s = 0.25
resource_per_thread = true
netem_dev = "lo"
netem_sudo = true
node_start_stagger_s = 0.05
ready_timeout_s = 120
stop_grace_s = 15
between_systems_s = 5
send_timeout_s = 7200
run_order = "shuffle"
system_order = "shuffle"
order_seed = 29
cpu_cap_mode = "off"
cpu_cap_scope = "system"
cpu_cap_cores = 0
cpu_cap_isolate_tooling = true
cpu_cap_tooling_cores = 2
cpu_cap_exclude_roles = ["sink"]

##############
## BASELINE ##
##############

[baseline]
event_queue_size = 8192
loopback_queue_size = 8192
case_end_grace_period = "15s"         # this should be longer than the result buffer policies to be safe
case_janitor_cleanup_interval = "1s"

[baseline.tcp_channels]
tcp_channel_mpsc_channel_size = 1024
peer_manager_mpsc_channel_size = 1024
message_queue_size = 4096
internal_message_ttl = "120s"
reconnect_start_delay = "200ms"
reconnect_max_delay = "5s"
wait_for_response_timeout = "60s"
connect_timeout = "5s"

[baseline.default_result_buffer]
policy = "Revocable"
duration = "10s"                    # this should exceed t3-t4 window, otherwise late verdicts will be ignored

[baseline.result_sink]
mpsc_channel_size = 262144
retry_interval = "5s"
retry_buffer_size = 32768
max_batch_size = 16384
flush_interval = "100ms"

[baseline.gossip]
gossip_outbound_mpsc_channel_size = 1024
gossip_inbound_mpsc_channel_size = 1024

[baseline.metrics]
queue_report_interval = "20ms"
queue_sample_resolution = "2ms"

[defaults.params]
catalog = "default"
role_assignment = "round-robin"
repeat = 1                        # 22 roles
nodes = 23                        # 22 constraint nodes + 1 sink -> 1 role per node
rate = 4000
cases = 10000                     # tier M
violation_rate = 0.2
violation_sampling = "exact"
step_secs = 1.0
case_gap_secs = 2.0               # ~13 concurrent cases (~26 roles/events per case in default synthetic streams)
burst = 16
msgtrace = true
idle_window_s = 20
quiescence_s = 120
max_wait_for_settlement_s = 240
external_central_sink = true
idle_only = false
push_fanout = 5
anti_entropy_secs = 2
anti_entropy_fanout = 1
case_end_ttl = 120
shuffle_secs = 5
shuffle_length = 4
cache_size = 20
ring_degree = 2
worker_threads = 2                # determined with E0b


# E0a - find sender ceiling and have coarse saturation info to fix rate sweeps
# no saturation below sender ceiling motivates E1 capped load sweeps
[[experiment]]
id = "E0a"
seeds = [2]
replicates = 1
systems = ["decentralized", "central"]
  [experiment.params]
  cases = 20000
  msgtrace = false
  burst = 32
  [experiment.grid]
  rate = [8000, 16000, 24000, 32000, 40000, 50000]

# E0b - find suitable tokio worker thread policy (answers: is thread oversubscription a problem in decentralized?)
[[experiment]]
id = "E0b"
seeds = [2]
replicates = 2
systems = ["decentralized", "central"]
  [experiment.params]
  msgtrace = false
  [experiment.grid]
  worker_threads = ["per-cpu", "share", "2"]
  rate = [4000, 16000]

# E0c - find system cpu cap (cap has to be small enough such that both systems can saturate)
# use saturation report script with --x-param cpu_cap_cores --x-direction decreasing
[[experiment]]
id = "E0c"
seeds = [2, 3]
replicates = 2
systems = ["decentralized", "central"]
  [experiment.params]
  msgtrace = false
  burst = 8
  cpu_cap_mode = "cpuset"
  cpu_cap_scope = "system"
  [experiment.grid]
  cpu_cap_cores = [20, 16, 12, 10, 8, 6, 4]
  rate = [8000, 16000]

# E0d - smoke run for sanity checks
# check model facts are comparable between systems, deployment facts are different (denominator/total amount) so probably only compare within system,
#   forwarders should also disclose model facts, check size of records/ with msg trace on, confirm gossip reach = 1 (othwerise raise case end ttl)
[[experiment]]
id = "E0d"
seeds = [2]
replicates = 1
systems = ["decentralized", "central"]
  [experiment.params]
  cases = 5000
  rate = 4000
  msgtrace = true

# E0e - msgtrace overhead (check how big the impact is)
[[experiment]]
id = "E0e"
seeds = [2, 3]
replicates = 2
systems = ["decentralized", "central"]
  [experiment.grid]
  msgtrace = [true, false]
  rate = [4000, 16000]

