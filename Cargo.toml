[package]
name = "distributed_online_cc"
version = "0.1.0"
edition = "2024"

[dependencies]
# cli parsing
clap = { version = "4.6.0", features = ["derive"] }
# logging
log = "0.4.29"
# tokio async runtime
tokio = { version = "1.52.1", features = ["full"] }
# byte container for networking
bytes = "1.11.1"
# serialization + deserialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# understand shell quotes
shell-words = "1.1.1"
