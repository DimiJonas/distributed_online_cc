[package]
name = "distributed_online_cc"
version = "0.1.0"
edition = "2024"

[dependencies]
# cli parsing
clap = { version = "4.6.0", features = ["derive"] }

# tokio async runtime
tokio = { version = "1.52.1", features = ["full", "test-util"] }
# includes a cancellation token for watchdog tasks
tokio-util = { version = "0.7.18", features = ["rt"] }

# byte container for networking
bytes = "1.11.1"

# serialization + deserialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# serde compatible toml parsing library to parse config
toml = "1.1.2"

# understand shell quotes
shell-words = "1.1.1"

# xml parsing
quick-xml = { version = "0.39.2", features = ["async-tokio"] }

# handle gregorian calendar time
chrono = { version = "0.4.44", features = ["serde"] }

# some process mining utilities
process_mining = "0.5.5"

# generate uuids
uuid = { version = "1.23.1", features = ["v4", "serde"] }

# using async functions in traits
async-trait = "0.1.89"

# logging
log = "0.4.29"
fern = { version = "0.7.1", features = ["colored"] }

# duration format in config file
humantime = "2.3.0"

# create custom errors
thiserror = "2.0.18"